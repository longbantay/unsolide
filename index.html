<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>unsolide</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    @font-face {
      font-family: 'ChelseaMarket';
      src: url('ChelseaMarket.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Fixiertes Logo oben rechts */
    .logo {
      position: fixed;
      top: 20px;
      right: 20px;
      height: 60px;
      z-index: 10;
    }

    /* Fixierter Instagram-Link unten mittig */
    .instagram-link {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'ChelseaMarket', sans-serif;
      font-size: 18px;
      color: black;
      text-decoration: none;
      z-index: 10;
    }

    .instagram-link:hover {
      text-decoration: underline;
    }

    /* Hauptcontainer */
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 0;
      padding-bottom: 120px;
      gap: 10vh;
    }

    /* erstes Element bekommt gezielten Abstand nach oben */
    .content-item:first-child {
      margin-top: 100px;
    }

    /* Inhaltselemente */
    .content-item {
      width: 65%;
      max-width: 500px;
      min-width: 280px;
    }

    /* Bilder */
    .content-item img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* 3D Modell */
    model-viewer {
      width: 100%;
      height: auto;
      min-height: 500px;
      background-color: transparent;
      display: block;
      margin-top: -90px; /* 👈 reduziert den Weißraum oben */
    }

    /* Mobile Anpassungen */
    @media (max-width: 600px) {
      .logo {
        height: 45px;
        top: 15px;
        right: 15px;
      }

      .instagram-link {
        font-size: 16px;
        bottom: 15px;
      }

      .content {
        gap: 10vh;
        padding-bottom: 100px;
      }

      .content-item {
        width: 90%;
      }

      .content-item:first-child {
        margin-top: 300px;
      }

      model-viewer {
        min-height: 320px;
        margin-top: -120px; /* etwas weniger Weißraum auf Handy */
      }
    }
  </style>

  <!-- Google Model Viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

  <!-- Logo -->
  <img src="logo_schwarz.png" alt="Logo" class="logo">

  <!-- Instagram Link -->
  <a href="https://www.instagram.com/wirsindunsolide/" class="instagram-link" target="_blank">Instagram</a>

  <!-- Inhalt -->
  <div class="content">
    <!-- Plakat Event -->
    <div class="content-item">
      <img src="postera4.jpg" alt="Plakat zum Event">
    </div>

    <!-- 3D Modell -->
    <div class="content-item">
      <model-viewer 
        src="test.glb" 
        alt="3D Modell der Gleishalle" 
        auto-rotate 
        camera-controls
        interaction-prompt="none"
        environment-image="https://modelviewer.dev/shared-assets/environments/neutral.hdr"
        style="--poster-color: transparent;">
      </model-viewer>
    </div>

    <!-- Neues Plakat fürs Feld -->
    <div class="content-item">
      <img src="plakat_feld.jpg" alt="Plakat fürs Feld">
    </div>

    <!-- Titelbild -->
    <div class="content-item">
      <img src="titelbild_unsolide.jpg" alt="Titelbild unsolide">
    </div>
  </div>

</body>
</html>
