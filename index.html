<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>unsolide</title>
  <link rel="icon" type="image/png" href="logo_klein.png"> <!-- kleines Logo im Tab -->

  <style>
    @font-face {
      font-family: 'ChelseaMarket';
      src: url('ChelseaMarket.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      position: absolute;
      top: 20px;
      right: 20px;
      height: 60px;
    }

    .instagram-link {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'ChelseaMarket', sans-serif;
      font-size: 18px;
      color: black;
      text-decoration: none;
    }

    .instagram-link:hover {
      text-decoration: underline;
    }

    .content-item {
      width: 90%;
      max-width: 800px;
      margin: 40px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .content-item:first-child {
      margin-top: -60px; /* etwas höher unter dem Logo */
    }

    img, object, model-viewer {
      width: 100%;
      height: auto;
      display: block;
      border: none;
    }

    /* spezieller Wrapper für das 3D-Modell */
    .model-container {
      margin-top: -40px; /* gleicht Weißraum oben aus */
    }

    .model-container model-viewer {
      width: 100%;
      height: auto;
      max-width: 800px;
      object-fit: contain;
      object-position: center;
    }

    /* Responsives Verhalten */
    @media (max-width: 768px) {
      .content-item {
        width: 95%;
        margin: 30px auto;
      }
    }
  </style>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

  <!-- Logo oben rechts -->
  <img src="logo_schwarz.png" alt="Logo" class="logo">

  <!-- Inhalte -->
  <div class="content-item">
    <img src="titelbild.jpg" alt="Titelbild">
  </div>

  <div class="content-item">
    <object data="plakat_feld.pdf" type="application/pdf" width="100%" height="600px"></object>
  </div>

  <div class="content-item model-container">
    <model-viewer
      src="test.glb"
      alt="3D Modell der Gleishalle"
      auto-rotate
      camera-controls
      environment-image="neutral.hdr"
      poster="loading.jpg"
      loading="lazy">
    </model-viewer>
  </div>

  <!-- Instagram-Link -->
  <a href="https://www.instagram.com/wirsindunsolide/" class="instagram-link" target="_blank">
    Instagram
  </a>

</body>
</html>
